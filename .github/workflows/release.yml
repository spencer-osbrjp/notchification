name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make app
      - run: ditto -c -k --keepParent Notchification.app Notchification.app.zip
      - run: gh release upload "v${{ needs.release.outputs.version }}" Notchification.app.zip
        env:
          GH_TOKEN: ${{ github.token }}
